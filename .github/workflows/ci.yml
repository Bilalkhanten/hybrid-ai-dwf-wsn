name: CI

# Pipeline graph (arrows are `needs:`):
#
#   lint ──┬──▶ unit-tests ──▶ smoke
#          │
#          └──▶ figures
#
# lint        ruff, errors only (syntax errors, undefined names); the code is not reformatted
# unit-tests  tests/test_units.py: DeLong, Wilcoxon, Holm, McNemar, entropy, windowing, bootstrap
# smoke       the whole pipeline (components -> fusion -> transfer -> adversarial -> aggregate) on SYNTHETIC data
# figures     diagrams.py (method schematics, uploaded) and make_figures.py on placeholder numbers (code path only)
#
# Everything here exercises the CODE PATH. No number produced by CI is a result: the smoke test runs on synthetic data
# and the placeholder figures are never uploaded. The real runs (four datasets, GPUs, boards) are described in the README.
# "Run workflow" on the Actions tab starts the pipeline by hand (workflow_dispatch).

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ruff (errors only)
        run: |
          python -m pip install --upgrade pip ruff
          ruff check --isolated --select E9,F63,F7,F82 .

  unit-tests:
    name: unit-tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (the tests need only these five packages)
        run: python -m pip install numpy scipy pandas scikit-learn pyyaml
      - name: Statistics, entropy and windowing tests
        run: python tests/test_units.py

  smoke:
    name: smoke
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install requirements.txt
        run: python -m pip install -r requirements.txt
      - name: Synthetic data (code path only)
        run: python tests/make_synthetic.py data
      - name: Run all stages with config/smoke.yaml
        run: python run_all.py --cfg config/smoke.yaml

  figures:
    name: figures
    needs: [lint]
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: python -m pip install numpy matplotlib
      - name: Method diagrams (no measured values)
        run: |
          mkdir diagrams
          cd diagrams
          python ../diagrams.py
          test "$(ls *.png | wc -l)" -eq 3
      - uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: diagrams/
          retention-days: 14
      - name: make_figures.py refuses the unfilled template
        run: |
          if python make_figures.py results_template.json "$RUNNER_TEMP/refused"; then
            echo "make_figures.py drew figures from the empty template"; exit 1
          fi
      - name: make_figures.py runs on placeholder numbers (code path only, not uploaded)
        run: |
          python tools/placeholder_results.py results_template.json "$RUNNER_TEMP/placeholder.json"
          python make_figures.py "$RUNNER_TEMP/placeholder.json" "$RUNNER_TEMP/placeholder_figs"
          test "$(ls "$RUNNER_TEMP"/placeholder_figs | wc -l)" -eq 6
